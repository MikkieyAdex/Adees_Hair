<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adees Hair | Sign In & Sign Up</title>
    
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Auth Page Custom Styles */
        body {
            background-color: var(--bs-body-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-card {
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .brand-logo-img {
            max-height: 90px;
            width: auto;
            object-fit: contain;
        }

        .toggle-password {
            cursor: pointer;
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none text-muted small fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <div class="text-center mb-4">
                    <img src="img/Gemini_Generated_Image_wzt3z2wzt3z2wzt3-removebg-preview.png" alt="Adees Hair Logo" class="brand-logo-img">
                </div>

                <div class="card auth-card p-4 p-md-5">
                    
                    <div id="signInSection">
                        <h3 class="card-title text-center fw-bold text-uppercase mb-4">Sign In</h3>
                        
                        <form id="signInForm">
                            <div class="mb-3">
                                <label for="signInEmail" class="form-label fw-semibold small">Email Address</label>
                                <input type="email" class="form-control py-2" id="signInEmail" placeholder="Enter your email" required>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="signInPassword" class="form-label fw-semibold small mb-0">Password</label>
                                    <a href="#" class="small text-decoration-none" style="color: var(--adees-purple-dark, #5c1b99);">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <input type="password" class="form-control py-2" id="signInPassword" placeholder="Enter your password" required>
                                    <span class="input-group-text toggle-password" onclick="togglePasswordVisibility('signInPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 text-uppercase fw-bold mt-3" style="background-color: #8A2BE2; border-color: #8A2BE2;">
                                Login
                            </button>
                        </form>

                        <hr class="my-4 text-muted">

                        <p class="text-center mb-0 small text-muted">
                            Don't have an account? 
                            <a href="javascript:void(0);" id="switchToSignUp" class="fw-bold text-decoration-none" style="color: #8A2BE2;">Sign Up Here</a>
                        </p>
                    </div>

                    <div id="signUpSection" class="d-none">
                        <h3 class="card-title text-center fw-bold text-uppercase mb-4">Create Account</h3>
                        
                        <form id="signUpForm">
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="firstName" class="form-label fw-semibold small">First Name</label>
                                    <input type="text" class="form-control py-2" id="firstName" placeholder="Firstname" required>
                                </div>
                                <div class="col-6">
                                    <label for="lastName" class="form-label fw-semibold small">Last Name</label>
                                    <input type="text" class="form-control py-2" id="lastName" placeholder="Lastname" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="signUpEmail" class="form-label fw-semibold small">Email Address</label>
                                <input type="email" class="form-control py-2" id="signUpEmail" placeholder="Enter your email" required>
                            </div>

                            <div class="mb-3">
                                <label for="dob" class="form-label fw-semibold small">Date Of Birth</label>
                                <input type="date" class="form-control py-2" id="dob" required>
                            </div>

                            <div class="mb-3">
                                <label for="signUpPassword" class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control py-2" id="signUpPassword" placeholder="Create a password" required>
                                    <span class="input-group-text toggle-password" onclick="togglePasswordVisibility('signUpPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control py-2" id="confirmPassword" placeholder="Re-enter password" required>
                                    <span class="input-group-text toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    I agree to the <a href="#" class="text-decoration-underline text-body">Terms of Service</a> & <a href="#" class="text-decoration-underline text-body">Privacy Policy</a>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 text-uppercase fw-bold" style="background-color: #8A2BE2; border-color: #8A2BE2;">
                                Sign Up
                            </button>
                        </form>

                        <hr class="my-4 text-muted">

                        <p class="text-center mb-0 small text-muted">
                            Already have an account? 
                            <a href="javascript:void(0);" id="switchToSignIn" class="fw-bold text-decoration-none" style="color: #8A2BE2;">Sign In Here</a>
                        </p>
                    </div>

                </div> <div class="text-center mt-4">
                    <p class="small text-muted mb-0">By continuing, you agree to Adees Hair's Terms of Service.</p>
                </div>

            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
